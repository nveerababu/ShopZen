<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon.png' %}">

</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4">
            
            <h2 class="text-center fw-bold mb-4 text-primary"> ShopZen LogIn</h2>

            <form method="post">
              {% csrf_token %}

              {{ form.as_p }}

              <div class="text-end mb-3">
                <a href="{% url 'password_reset' %}" class="small text-muted text-decoration-none">Forgot Password?</a>
              </div>

              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg rounded-3">Log In</button>
              </div>
            </form>

            <div class="text-center mt-3">
              <small class="text-muted">Don't have an account? <a href="/signup/" class="text-decoration-none">Sign Up</a></small>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
