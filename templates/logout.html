{% extends 'navbar.html' %}

{% block body_block %}
<style>
  /* Button click / focus ring raakunda cheyadaniki */
  .btn:focus {
    box-shadow: none !important;
    outline: none !important;
  }
</style>

<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white text-center" style="max-width: 440px; width: 100%;">
    
    <!-- Success / Exit Icon -->
    <div class="mb-3">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light text-primary" style="width: 70px; height: 70px; font-size: 32px;">
        👋
      </div>
    </div>

    <!-- Message -->
    <h3 class="fw-bold text-dark mb-2">You Have Logged Out</h3>
    <p class="text-muted small mb-4">
      Thank you for visiting ShopZen. Your session has been safely ended.
    </p>

    <!-- Action Buttons -->
    <div class="d-flex flex-column gap-2">
      <a href="/accounts/login/" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
        Log In Again
      </a>
      <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100 py-2 rounded-3">
        Back to Home
      </a>
    </div>

  </div>
</div>
{% endblock %}
