
{% extends 'navbar.html' %}

{% block body_block %}

<div class="container text-center mt-5">

    <h2 class="text-success">
        ✓ Order Placed Successfully!
    </h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <p>Thank you for shopping with ShopZen!</p>

    <a href="{% url 'home' %}"
       class="btn btn-primary">
        Continue Shopping
    </a>

</div>

{% endblock %}
